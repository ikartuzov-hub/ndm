:root[data-theme="dark"]{color-scheme:dark;--bg:#15110E;--ink:#F2EAE2;--ink-soft:#B7A797;--line:#382C23;--accent:#FF8A4C;--accent-soft:#3A2418;--card:#1D1814;--eu:#1D4FA0;--mk:#7FA6EC;--ok:#5CCB8A;--ok-soft:#173A26}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 "IBM Plex Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}

.topctrl{position:fixed;top:12px;right:14px;z-index:7;display:flex;gap:8px}
.rb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font:500 12px/1 "IBM Plex Sans",sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center}
#langmenu{position:fixed;top:56px;right:14px;z-index:8;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;display:none;min-width:170px}
#langmenu.on{display:block}
#langmenu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;color:var(--ink);font:400 15px "IBM Plex Sans",sans-serif;cursor:pointer}
#langmenu button.cur{color:var(--accent);font-weight:500}
header{padding:70px 0 6px}
.tag{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--ink-soft);margin-bottom:12px}
h1{font-size:28px;margin:0 0 8px}

.nums{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}
.num{flex:1 1 0;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}

.num span{font-size:13px;color:var(--ink-soft);line-height:1.3;display:block}
/* три решения */
.q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:10px 0;position:relative}
.q .n{position:absolute;right:14px;top:12px;font:600 13px Bitter,serif;color:var(--ink-soft);opacity:.7}
.q h2{font-size:19px;margin:0 0 6px;padding-right:28px}
.q p{margin:0;color:var(--ink-soft);font-size:15.5px}
.q.ok{border-color:var(--ok);background:var(--ok-soft)}
.q.ok h2{color:var(--ok)}
.q.no{border-color:var(--accent)}
.q.no h2{color:var(--accent)}
.quote{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;background:var(--accent-soft);border-radius:8px;padding:6px 10px;margin:8px 0 0;color:var(--ink);display:inline-block}
.go{display:block;text-align:center;background:var(--accent);color:#fff;border-radius:12px;padding:13px;font-weight:500;text-decoration:none;margin:12px 0 0;font-size:16px;border:0;width:100%;font-family:inherit;cursor:pointer}
.go.soft{background:var(--card);color:var(--accent);border:1px solid var(--accent)}
.go.wa{background:#25D366;color:#0B3D20;display:flex;align-items:center;justify-content:center;gap:10px}
.go.wa svg{width:22px;height:22px;flex:none}
.docs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.docs a{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13.5px;color:var(--ink);text-decoration:none}
/* термин по тапу */
a.t{color:var(--accent);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;text-decoration-thickness:1.5px;cursor:pointer}
.line{display:flex;align-items:center;gap:10px;margin:18px 0 6px;font-size:15.5px;color:var(--ink-soft)}
.line b{color:var(--ink)}
.foot2{margin:26px 0 0;font-size:13.5px;color:var(--ink-soft);text-align:center}
footer{margin-top:28px;text-align:center;font-size:14px;color:var(--ink-soft)}
footer a{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px;display:inline-block;padding:6px 4px;color:var(--ink-soft)}
/* шторка пояснений */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
#veil.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:20px 20px 0 0;padding:14px 20px 28px;max-width:560px;margin:0 auto;transform:translateY(110%);transition:transform .22s ease-out;box-shadow:0 -10px 40px rgba(0,0,0,.18);max-height:80vh;overflow:auto}
#sheet.on{transform:none}
#sheet:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
#sheet h3{font-size:18px;margin:0 0 6px}
#sheet p{margin:0;font-size:15.5px;color:var(--ink-soft)}
#sheet a.more{display:inline-block;margin-top:12px;color:var(--accent);font-weight:500}
#sheet .x{position:absolute;right:12px;top:10px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:16px;cursor:pointer}
@media(prefers-reduced-motion:reduce){#sheet{transition:none}}
</style>

<script>
(function(){
var ORDER=['pt','en','ru','es','de'];
var qs=new URLSearchParams(location.search);
function ls(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
var lang=(window.NDM_LANG&&L[window.NDM_LANG])?window.NDM_LANG
        :(qs.get('lang')||ls('ndm-lang')||(navigator.language||'pt').slice(0,2).toLowerCase());
if(!L[lang])lang='pt';
var theme=qs.get('theme')||ls('ndm-theme')||'light';
function langPath(Lg){var p=location.pathname.split('/').filter(Boolean);
  if(p.length&&ORDER.indexOf(p[p.length-1])>=0)p.pop();
  if(Lg!=='pt')p.push(Lg);
  return '/'+(p.length?p.join('/')+'/':'');}
function langHref(h){var u=new URL(h,location.href);
  var p=u.pathname.split('/').filter(Boolean);
  if(p.length&&ORDER.indexOf(p[p.length-1])>=0)p.pop();
  if(lang!=='pt')p.push(lang);
  return u.origin+'/'+(p.length?p.join('/')+'/':'')+u.hash;}
function applyTheme(){document.documentElement.setAttribute('data-theme',theme==='dark'?'dark':'light');document.getElementById('themeBtn').textContent=theme==='dark'?'☾':'☀';}
function mstrip(x){return String(x==null?'':x).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();}
function mset(sel,v){var e=document.querySelector(sel);if(e&&v)e.setAttribute('content',v);}
function apply(){
  var t=L[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(function(e){var k=e.getAttribute('data-t');if(t[k]!==undefined)e.innerHTML=t[k];});
  document.getElementById('langBtn').textContent=t.code;
  document.getElementById('hubLink').href='https://seedwave.pt/hub/?lang='+lang+'&theme='+theme;
  ['fullLink','fullStep'].forEach(function(id){var a=document.getElementById(id);
    if(!a.getAttribute('data-h'))a.setAttribute('data-h',a.getAttribute('href'));
    a.href=langHref(a.getAttribute('data-h'));});
  lsSet('ndm-lang',lang);
  if(t.mt){document.title=t.mt;mset('meta[property="og:title"]',t.mt);}
  if(t.md){mset('meta[name="description"]',t.md);mset('meta[property="og:description"]',t.md);}
}
var m=document.getElementById('langmenu');
function paintMenu(){m.innerHTML=ORDER.filter(function(k){return L[k];}).map(function(k){
  return '<button type="button" data-l="'+k+'"'+(k===lang?' class="cur"':'')+'>'+L[k].code+'  '+L[k].name+'</button>';}).join('');}
document.getElementById('langBtn').onclick=function(e){e.stopPropagation();m.classList.toggle('on');};
m.onclick=function(e){var b=e.target.closest('button');if(!b)return;var k=b.getAttribute('data-l');
  if(window.NDM_LANG){lsSet('ndm-lang',k);location.href=langPath(k)+(theme==='dark'?'?theme=dark':'');return;}
  lang=k;m.classList.remove('on');paintMenu();apply();};
document.addEventListener('click',function(){m.classList.remove('on');});
document.getElementById('themeBtn').onclick=function(){theme=theme==='dark'?'light':'dark';lsSet('ndm-theme',theme);applyTheme();apply();};
/* шторка */
var veil=document.getElementById('veil'),sh=document.getElementById('sheet');
function openSheet(k){var t=L[lang];document.getElementById('shT').innerHTML=t[k+'T']||'';document.getElementById('shP').innerHTML=t[k]||'';
  var mo=document.getElementById('shMore');var h=t[k+'H'];
  if(h){mo.hidden=false;mo.textContent=t.more;mo.href=langHref(h);}else mo.hidden=true;
  veil.classList.add('on');sh.classList.add('on');}
function closeSheet(){veil.classList.remove('on');sh.classList.remove('on');}
document.querySelectorAll('a.t').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openSheet(a.getAttribute('data-d'));});});
veil.onclick=closeSheet;document.getElementById('sheetX').onclick=closeSheet;
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});
/* поделиться */
document.getElementById('share').onclick=function(){var t=L[lang];var u=location.origin+langPath(lang);
  var d={title:document.title,text:t.shareText,url:u};
  if(navigator.share){navigator.share(d).catch(function(){});}
  else{navigator.clipboard&&navigator.clipboard.writeText(u);this.textContent=t.copied;var b=this;setTimeout(function(){b.textContent=t.share;},1600);}};
document.getElementById('yr').textContent=new Date().getFullYear();
applyTheme();paintMenu();apply();
})();
</script>
