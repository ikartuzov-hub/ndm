<style>
:root{color-scheme:light;--bg:#FAF6F1;--ink:#1A1512;--ink-soft:#5E5248;--line:#E6D9CC;--accent:#0E6E63;--accent-soft:#E0F2EE;--card:#fff;--surface:#fff;--gold:#E3A21A;--gold-soft:#FDF1D6;--red:#B23A0E}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12110F;--ink:#F2EAE2;--ink-soft:#BBAE9F;--line:#38302A;--accent:#4FC2B1;--accent-soft:#163430;--card:#1C1915;--surface:#1C1915;--gold:#F2B83A;--gold-soft:#3A2E14;--red:#FF8A4C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.55 "IBM Plex Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:580px;margin:0 auto;padding:0 18px 56px}
h1,h2,h3{font-family:Bitter,Georgia,serif;font-weight:600;line-height:1.2;margin:0}
.brandmark{position:fixed;top:12px;left:16px;height:40px;z-index:6;display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink)}
.brandmark b{font:700 19px/1 Bitter,Georgia,serif}
.topctrl{position:fixed;top:12px;right:14px;z-index:7;display:flex;gap:8px}
.rb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font:500 12px/1 "IBM Plex Sans",sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center}
#langmenu{position:fixed;top:56px;right:14px;z-index:8;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;display:none;min-width:170px}
#langmenu.on{display:block}
#langmenu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;color:var(--ink);font:400 15px "IBM Plex Sans",sans-serif;cursor:pointer}
#langmenu button.cur{color:var(--accent);font-weight:600}
header{padding:72px 0 4px}
.tag{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink-soft);margin-bottom:12px}
h1{font-size:31px;margin:0 0 10px}
.lead{color:var(--ink-soft);font-size:18px;margin:0 0 6px}
.lead b{color:var(--ink)}
/* вау: номер + PIN = ключ */
.formula{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;margin:16px 0 8px;padding:14px 10px 12px;overflow:hidden;cursor:pointer}
.formula svg{display:block;width:100%;height:auto}
.formula .cap{display:flex;justify-content:space-around;font-size:14px;color:var(--ink-soft);margin-top:4px;text-align:center}
.formula .cap b{color:var(--accent);font-weight:600}
.chipA{animation:inA 1.1s cubic-bezier(.2,.8,.2,1) .2s both}
.chipB{animation:inB 1.1s cubic-bezier(.2,.8,.2,1) .45s both}
.plus,.eq{animation:fade .5s ease 1.2s both}
.key{transform-origin:470px 70px;animation:keyIn 1s cubic-bezier(.3,1.6,.5,1) 1.55s both}
.glow{transform-origin:470px 70px;animation:glow 1.6s ease-out 1.8s both}
@keyframes inA{from{transform:translateX(-140px);opacity:0}to{transform:none;opacity:1}}
@keyframes inB{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes keyIn{from{transform:scale(.2) rotate(-60deg);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.replay .chipA,.replay .chipB,.replay .plus,.replay .eq,.replay .key,.replay .glow{animation:none}
.slogan{font:600 20px/1.3 Bitter,Georgia,serif;text-align:center;margin:10px 0 2px;color:var(--ink)}
.slogan span{color:var(--accent)}
.where{background:var(--gold-soft);border-radius:16px;padding:12px 16px;margin:14px 0 0;font-size:16.5px}
.hint{display:flex;gap:10px;align-items:flex-start;margin:10px 0 0;padding:12px 16px;border:1.5px dashed var(--gold);border-radius:16px;color:var(--ink);text-decoration:none;font-size:16.5px}
.hint i{font-style:normal;font-size:22px}
.where b{display:block;font-family:Bitter,Georgia,serif;font-size:18px;margin-bottom:2px}
h2.sec{font-size:23px;margin:30px 0 10px}
.ze{background:var(--card);border:1px solid var(--line);border-radius:22px;margin:18px 0 8px;padding:12px 12px 10px}
.ze h2{font-size:21px;margin:2px 4px 10px}
.ze video{display:block;width:100%;aspect-ratio:1/1;border-radius:14px;background:#FAF6F1}
.ze p{margin:8px 4px 0;font-size:14px;color:var(--ink-soft)}
/* шаги с картинками */
.step{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px 16px;margin:12px 0;display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:center}
.step .pic{width:118px}
.step .pic svg{width:100%;height:auto;display:block}
.step .no{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font:600 16px Bitter,serif;margin-bottom:6px}
:root[data-theme="dark"] .step .no{color:#0B1F1C}
.step h3{font-size:19px;margin:0 0 4px}
.step p{margin:0;color:var(--ink-soft);font-size:16.5px}
.step p b{color:var(--ink)}
@media(max-width:380px){.step{grid-template-columns:92px 1fr}.step .pic{width:92px}}
.box{background:var(--accent-soft);border-radius:20px;padding:16px 18px;margin:14px 0}
.box h3{font-size:19px;margin:0 0 6px;color:var(--accent)}
.box p{margin:0;font-size:16.5px}
.box ul{margin:8px 0 0;padding-left:20px;font-size:16.5px}
.go{display:block;text-align:center;background:var(--accent);color:#fff;border-radius:14px;padding:15px;font-weight:600;text-decoration:none;margin:12px 0 0;font-size:17px;border:0;width:100%;font-family:inherit;cursor:pointer}
:root[data-theme="dark"] .go{color:#0B1F1C}
.go.soft{background:var(--card);color:var(--accent);border:1.5px solid var(--accent)}
.go.wa{background:#25D366;color:#0B3D20;display:flex;align-items:center;justify-content:center;gap:10px}
.go.wa svg{width:22px;height:22px;flex:none}
/* «что-то пошло не так» — крупные кнопки-пояснения */
.probs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 0}
.probs a{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 12px;color:var(--ink);text-decoration:none;font-size:16px;line-height:1.25;min-height:64px}
.probs a i{font-style:normal;font-size:24px;flex:none}
.probs a:active{border-color:var(--accent)}
.srcs{margin:8px 0 0;padding:0;list-style:none}
.srcs li{margin:0 0 8px;font-size:16px}
.srcs a{color:var(--accent);text-underline-offset:3px}
.foot2{margin:24px 0 0;font-size:14px;color:var(--ink-soft);text-align:center}
footer{margin-top:24px;padding-bottom:12px;text-align:center;font-size:15px;color:var(--ink-soft)}
footer a{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px;display:inline-block;padding:8px 4px;color:var(--ink-soft)}
/* шторка пояснений */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;display:none}
#veil.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:22px 22px 0 0;padding:14px 22px 30px;max-width:580px;margin:0 auto;transform:translateY(110%);transition:transform .22s ease-out;box-shadow:0 -10px 40px rgba(0,0,0,.2);max-height:82vh;overflow:auto}
#sheet.on{transform:none}
#sheet:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
#sheet h3{font-size:20px;margin:0 0 8px;padding-right:36px}
#sheet p{margin:0 0 8px;font-size:17px;color:var(--ink-soft)}
#sheet p b{color:var(--ink)}
#sheet a.more{display:inline-block;margin-top:6px;color:var(--accent);font-weight:600;font-size:17px}
#sheet .x{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:16px;cursor:pointer}
/* карточка-памятка для печати */
#memo{display:none}
@media print{
  body{background:#fff;color:#000}
  .wrap>*:not(#memo),.brandmark,.topctrl,#langmenu,#veil,#sheet{display:none!important}
  #memo{display:block!important;border:2px dashed #0E6E63;border-radius:16px;padding:18px 22px;max-width:640px;margin:20px auto;font:16px/1.5 "IBM Plex Sans",sans-serif}
  #memo h2{font:700 22px Bitter,serif;margin:0 0 4px;color:#0E6E63}
  #memo ol{margin:8px 0;padding-left:22px}
  #memo .ln{border-bottom:1px solid #999;height:34px;margin:10px 0 2px;font-weight:600;color:#0E6E63;padding-top:6px}
  #memo small{color:#555}
}
@media(prefers-reduced-motion:reduce){.chipA,.chipB,.plus,.eq,.key,.glow{animation:none!important}.glow{opacity:0}#sheet{transition:none}}
</style>

        :(qs.get('lang')||ls('ndm-lang')||(navigator.language||'pt').slice(0,2).toLowerCase());
if(!L[lang])lang='pt';
var theme=qs.get('theme')||ls('ndm-theme')||'light';
function langPath(Lg){var p=location.pathname.split('/').filter(Boolean);
  if(p.length&&ORDER.indexOf(p[p.length-1])>=0)p.pop();
  if(Lg!=='pt')p.push(Lg);
  return '/'+(p.length?p.join('/')+'/':'');}
function applyTheme(){document.documentElement.setAttribute('data-theme',theme==='dark'?'dark':'light');document.getElementById('themeBtn').textContent=theme==='dark'?'☾':'☀';}
function mset(sel,v){var e=document.querySelector(sel);if(e&&v)e.setAttribute('content',v);}
function apply(){
  var t=L[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(function(e){var k=e.getAttribute('data-t');if(t[k]!==undefined)e.innerHTML=t[k];});
  document.querySelectorAll('[data-t-aria]').forEach(function(e){var k=e.getAttribute('data-t-aria');if(t[k])e.setAttribute('aria-label',t[k].replace(/<[^>]*>/g,''));});
  document.getElementById('langBtn').textContent=t.code;
  document.getElementById('hubLink').href='https://seedwave.pt/hub/?lang='+lang+'&theme='+theme;
  lsSet('ndm-lang',lang);
  if(t.mt){document.title=t.mt;mset('meta[property="og:title"]',t.mt);}
  zeSrc();
  if(t.md){mset('meta[name="description"]',t.md);mset('meta[property="og:description"]',t.md);}
}
var m=document.getElementById('langmenu');
function paintMenu(){m.innerHTML=ORDER.filter(function(k){return L[k];}).map(function(k){
  return '<button type="button" data-l="'+k+'"'+(k===lang?' class="cur"':'')+'>'+L[k].code+'  '+L[k].name+'</button>';}).join('');}
document.getElementById('langBtn').onclick=function(e){e.stopPropagation();m.classList.toggle('on');};
m.onclick=function(e){var b=e.target.closest('button');if(!b)return;var k=b.getAttribute('data-l');
  if(window.NDM_LANG){lsSet('ndm-lang',k);location.href=langPath(k)+(theme==='dark'?'?theme=dark':'');return;}
  lang=k;m.classList.remove('on');paintMenu();apply();};
document.addEventListener('click',function(){m.classList.remove('on');});
document.getElementById('themeBtn').onclick=function(){theme=theme==='dark'?'light':'dark';lsSet('ndm-theme',theme);applyTheme();apply();};
/* вау: тап по формуле — собрать ключ ещё раз */
var f=document.getElementById('formula');
f.onclick=function(){f.classList.add('replay');void f.offsetWidth;f.classList.remove('replay');};
/* мультик с Зé: PT/RU — свои, остальным EN; играет без звука, когда виден */
function zeSrc(){var v=document.getElementById('zeV');var k=lang==='pt'||lang==='ru'?lang:'en';
  if(v.getAttribute('data-k')===k)return;v.setAttribute('data-k',k);
  v.poster='/cmd/video/ze_'+k+'.jpg';v.src='/cmd/video/ze_'+k+'.mp4';}
if('IntersectionObserver' in window){var zv=document.getElementById('zeV');new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){zv.play().catch(function(){});}else zv.pause();});},{threshold:.5}).observe(zv);}
/* шторка */
var veil=document.getElementById('veil'),sh=document.getElementById('sheet');
function openSheet(k){var t=L[lang];document.getElementById('shT').innerHTML=t[k+'T']||'';document.getElementById('shP').innerHTML=t[k]||'';
  var mo=document.getElementById('shMore');var h=t[k+'H'];
  if(h){mo.hidden=false;mo.textContent=t.more;mo.href=h;}else mo.hidden=true;
  veil.classList.add('on');sh.classList.add('on');}
function closeSheet(){veil.classList.remove('on');sh.classList.remove('on');}
document.querySelectorAll('a.t').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();openSheet(a.getAttribute('data-d'));});});
veil.onclick=closeSheet;document.getElementById('sheetX').onclick=closeSheet;
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});
document.getElementById('printBtn').onclick=function(){window.print();};
/* поделиться */
document.getElementById('share').onclick=function(){var t=L[lang];var u=location.origin+langPath(lang);
  var d={title:document.title,text:t.shareText,url:u};
  if(navigator.share){navigator.share(d).catch(function(){});}
  else{navigator.clipboard&&navigator.clipboard.writeText(u);this.textContent=t.copied;var b=this;setTimeout(function(){b.textContent=t.share;},1600);}};
document.getElementById('yr').textContent=new Date().getFullYear();
applyTheme();paintMenu();apply();
})();
</script>
