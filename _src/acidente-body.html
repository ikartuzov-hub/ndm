:root{color-scheme:light;--bg:#FAF6F1;--ink:#1A1512;--ink-soft:#5E5248;--line:#E6D9CC;--accent:#B4410F;--accent-soft:#FBE6DA;--card:#fff;--surface:#fff;--gold:#E3A21A;--gold-soft:#FDF1D6;--blue:#2F6DB5;--blue-soft:#E3EEFA;--yel:#C99A06;--yel-soft:#FFF5CC}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.55 "IBM Plex Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:600px;margin:0 auto;padding:0 18px 56px}
h1,h2,h3{font-family:Bitter,Georgia,serif;font-weight:600;line-height:1.2;margin:0}
.brandmark{position:fixed;top:12px;left:16px;height:40px;z-index:6;display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink)}
.brandmark b{font:700 19px/1 Bitter,Georgia,serif}
.topctrl{position:fixed;top:12px;right:14px;z-index:7;display:flex;gap:8px}
.rb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font:500 12px/1 "IBM Plex Sans",sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center}
#langmenu{position:fixed;top:56px;right:14px;z-index:8;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;display:none;min-width:170px}
#langmenu.on{display:block}
#langmenu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;color:var(--ink);font:400 15px "IBM Plex Sans",sans-serif;cursor:pointer}
#langmenu button.cur{color:var(--accent);font-weight:600}
header{padding:72px 0 4px}
.tag{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink-soft);margin-bottom:12px}
h1{font-size:31px;margin:0 0 10px}
.lead{color:var(--ink-soft);font-size:18px;margin:0 0 6px}
.lead b{color:var(--ink)}
/* вау: «Показать португальцу» — фраза на весь экран + голос */
.sos{position:relative;background:var(--accent);color:#fff;border-radius:24px;margin:16px 0 8px;padding:18px 18px 16px;overflow:hidden}
:root[data-theme="dark"] .sos{color:#2A1206}
.sos .tri{position:absolute;right:-8px;top:-6px;width:120px;height:120px;opacity:.22}
.sos .tri path{animation:pulse 2.4s ease-in-out infinite;transform-origin:50px 50px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.sos h2{font-size:23px;margin:0 0 4px;position:relative}
.sos p{margin:0 0 12px;font-size:16px;opacity:.92;position:relative}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.chips button{background:rgba(255,255,255,.96);color:#1A1512;border:0;border-radius:14px;padding:11px 12px;text-align:left;font:500 15px/1.25 "IBM Plex Sans",sans-serif;cursor:pointer;min-height:58px;display:flex;gap:8px;align-items:center}
.chips button i{font-style:normal;font-size:20px;flex:none}
.chips button:active{transform:scale(.97)}
.chips .wide{grid-column:1/-1;justify-content:center;background:#1A1512;color:#fff;font-weight:600}
.slogan{font:600 20px/1.3 Bitter,Georgia,serif;text-align:center;margin:12px 0 2px;color:var(--ink)}
.slogan span{color:var(--accent)}
.ze{background:var(--card);border:1px solid var(--line);border-radius:22px;margin:18px 0 8px;padding:12px 12px 10px}
.ze video{display:block;width:100%;aspect-ratio:1/1;border-radius:14px;background:#FAF6F1}
.ze p{margin:8px 4px 0;font-size:14px;color:var(--ink-soft)}
h2.sec{font-size:24px;margin:34px 0 6px}
p.sub{margin:0 0 10px;color:var(--ink-soft);font-size:16.5px}
/* шаги */
.step{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px 16px;margin:10px 0;display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:start}
.step .ic{width:54px;height:54px;border-radius:16px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:28px}
.step .no{font:600 13px "IBM Plex Mono",monospace;color:var(--accent);letter-spacing:.06em}
.step h3{font-size:19px;margin:2px 0 4px}
.step p{margin:0;color:var(--ink-soft);font-size:16.5px}
.step p b{color:var(--ink)}
/* бланк */
.cases{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.cases button{flex:1 1 30%;min-width:150px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 10px;font:500 15px/1.25 "IBM Plex Sans",sans-serif;cursor:pointer;text-align:left}
.cases button i{font-style:normal;display:block;font-size:20px;margin-bottom:2px}
.cases button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.cnote{background:var(--gold-soft);border-radius:16px;padding:12px 16px;font-size:16px;margin:0 0 10px}
.blank{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px}
.blank svg{display:block;width:100%;height:auto}
.blank .z{cursor:pointer}
.blank .z rect{transition:fill .2s}
.blank .z:hover rect,.blank .z:focus rect{stroke-width:3}
.blank .z.hl rect{fill:var(--gold-soft);stroke:var(--gold);stroke-width:3}
.blank figcaption{font-size:14px;color:var(--ink-soft);text-align:center;margin-top:6px}
.circ{margin:12px 0 0;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.circ .hd{display:grid;grid-template-columns:44px 1fr 44px;font:600 14px "IBM Plex Sans",sans-serif;text-align:center;padding:8px 0;border-bottom:1px solid var(--line)}
.circ .hd span:first-child{color:var(--blue)}.circ .hd span:last-child{color:var(--yel)}
.circ .r{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;border-bottom:1px solid var(--line);padding:7px 0}
.circ .r:last-child{border-bottom:0}
.circ .bx{width:22px;height:22px;border:2px solid var(--ink-soft);border-radius:4px;margin:0 auto;display:flex;align-items:center;justify-content:center;font:700 15px/1 sans-serif;color:#fff}
.circ .bx.a.on{background:var(--blue);border-color:var(--blue)}
.circ .bx.b.on{background:var(--yel);border-color:var(--yel)}
.circ .bx.mb{border-style:dashed;border-color:var(--yel)}
.circ .lb{font-size:15px;line-height:1.3;padding:0 4px}
.circ .lb b{display:block;font-weight:500;color:var(--ink)}
.circ .lb small{color:var(--ink-soft);font-size:14px}
.circ .lb em{font-style:normal;font:600 12px "IBM Plex Mono",monospace;color:var(--ink-soft);margin-right:4px}
.circ .r.hit{background:var(--gold-soft)}
.rules{margin:8px 0 0;padding:0;list-style:none;counter-reset:r}
.rules li{counter-increment:r;position:relative;padding:12px 14px 12px 52px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 8px;font-size:16.5px}
.rules li:before{content:counter(r);position:absolute;left:14px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font:600 15px/28px Bitter,serif;text-align:center}
:root[data-theme="dark"] .rules li:before{color:#2A1206}
.rules li b{color:var(--ink)}
.two{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.two{grid-template-columns:1fr 1fr}}
.col{border-radius:18px;padding:14px 16px}
.col h3{font-size:18px;margin:0 0 6px}
.col ul{margin:0;padding-left:20px;font-size:16px}
.col li{margin:0 0 5px}
.col.y{background:var(--accent-soft)}.col.y h3{color:var(--accent)}
.col.n{background:var(--blue-soft)}.col.n h3{color:var(--blue)}
.box{background:var(--accent-soft);border-radius:20px;padding:16px 18px;margin:14px 0}
.box h3{font-size:19px;margin:0 0 6px;color:var(--accent)}
.box p{margin:0 0 6px;font-size:16.5px}
.box ul{margin:6px 0 0;padding-left:20px;font-size:16.5px}
.tl{margin:8px 0 0;padding:0;list-style:none;border-left:3px solid var(--accent);margin-left:10px}
.tl li{position:relative;padding:0 0 14px 20px;font-size:16.5px}
.tl li:before{content:"";position:absolute;left:-9px;top:5px;width:15px;height:15px;border-radius:50%;background:var(--card);border:3px solid var(--accent)}
.tl li b{display:block;font-family:Bitter,Georgia,serif;font-size:18px}
.case{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:16px;padding:14px 16px;margin:18px 0 0}
.case b{display:block;font-family:Bitter,Georgia,serif;font-size:18px;margin-bottom:4px}
.case p{margin:0 0 6px;font-size:16.5px;color:var(--ink-soft)}
.calls{display:grid;gap:8px;margin:8px 0 0}
.calls a{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;color:var(--ink);text-decoration:none;font-size:16px;line-height:1.3}
.calls a i{font-style:normal;font-size:24px;flex:none;width:30px;text-align:center}
.calls a b{display:block}
.calls a small{color:var(--ink-soft);font-size:14.5px}
.calls a.red{background:var(--accent);color:#fff;border-color:var(--accent)}
.calls a.red small{color:#fff;opacity:.9}
:root[data-theme="dark"] .calls a.red,:root[data-theme="dark"] .calls a.red small{color:#2A1206}
.qa{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:0 0 8px}
.qa h3{font-size:17.5px;margin:0 0 4px}
.qa p{margin:0;font-size:16px;color:var(--ink-soft)}
.go{display:block;text-align:center;background:var(--accent);color:#fff;border-radius:14px;padding:15px;font-weight:600;text-decoration:none;margin:12px 0 0;font-size:17px;border:0;width:100%;font-family:inherit;cursor:pointer}
:root[data-theme="dark"] .go{color:#2A1206}
.go.soft{background:var(--card);color:var(--accent);border:1.5px solid var(--accent)}
.go.wa{background:#25D366;color:#0B3D20;display:flex;align-items:center;justify-content:center;gap:10px}
.go.wa svg{width:22px;height:22px;flex:none}
.srcs{margin:8px 0 0;padding:0;list-style:none}
.srcs li{margin:0 0 8px;font-size:15.5px}
.srcs a{color:var(--accent);text-underline-offset:3px}
.foot2{margin:24px 0 0;font-size:14px;color:var(--ink-soft);text-align:center}
footer{margin-top:24px;padding-bottom:12px;text-align:center;font-size:15px;color:var(--ink-soft)}
footer a{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px;display:inline-block;padding:8px 4px;color:var(--ink-soft)}
/* шторка */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:20;display:none}
#veil.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:22px 22px 0 0;padding:14px 22px 30px;max-width:600px;margin:0 auto;transform:translateY(110%);transition:transform .22s ease-out;box-shadow:0 -10px 40px rgba(0,0,0,.2);max-height:84vh;overflow:auto}
#sheet.on{transform:none}
#sheet:before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
#sheet h3{font-size:20px;margin:0 0 8px;padding-right:36px}
#sheet p{margin:0 0 8px;font-size:17px;color:var(--ink-soft)}
#sheet p b{color:var(--ink)}
#sheet pre{white-space:pre-wrap;font:15px/1.5 "IBM Plex Sans",sans-serif;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 8px;color:var(--ink)}
#sheet .x{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:16px;cursor:pointer}
/* полноэкранная фраза */
#big{position:fixed;inset:0;z-index:30;background:var(--accent);color:#fff;display:none;flex-direction:column;padding:22px 22px calc(22px + env(safe-area-inset-bottom))}
:root[data-theme="dark"] #big{color:#2A1206}
#big.on{display:flex}
#big .top{display:flex;justify-content:space-between;align-items:center;font:600 14px "IBM Plex Mono",monospace;opacity:.9}
#big .top button{background:rgba(255,255,255,.2);color:inherit;border:0;border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer}
#big .pt{flex:1;display:flex;align-items:center;font:700 clamp(30px,8.5vw,56px)/1.18 Bitter,Georgia,serif;margin:10px 0}
#big .tr{font-size:18px;opacity:.92;margin:0 0 16px;min-height:2.4em}
#big .nav{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px}
#big .nav button{border:0;border-radius:16px;padding:16px 8px;font:600 17px "IBM Plex Sans",sans-serif;background:rgba(255,255,255,.95);color:#1A1512;cursor:pointer}
#big .nav button.say{background:#1A1512;color:#fff}
/* памятка на печать */
#memo{display:none}
@media print{
  body{background:#fff;color:#000}
  .wrap>*:not(#memo),.brandmark,.topctrl,#langmenu,#veil,#sheet,#big{display:none!important}
  #memo{display:block!important;border:2px dashed #B4410F;border-radius:16px;padding:16px 20px;max-width:680px;margin:14px auto;font:14px/1.45 "IBM Plex Sans",sans-serif}
  #memo h2{font:700 20px Bitter,serif;margin:0 0 6px;color:#B4410F}
  #memo ol{margin:6px 0;padding-left:20px}
  #memo .ph{margin:8px 0 0;padding:0;list-style:none}
  #memo .ph li{margin:0 0 4px}
  #memo .ln{border-bottom:1px solid #999;height:28px;margin:8px 0 2px;font-weight:600;color:#B4410F;padding-top:4px}
}
@media(prefers-reduced-motion:reduce){.sos .tri path{animation:none}#sheet{transition:none}.blank .z rect{transition:none}}
</style>

<script>

 [6,8,88,100,44,'A'],[7,8,136,100,32,'A'],[8,8,172,100,44,'A'],[9,8,220,100,44,'A'],[10,8,268,100,40,'A'],[11,8,312,100,30,'A'],[14,8,346,100,22,'A'],
 [12,112,88,76,220],[13,112,312,76,56],

}

    var st=col==='A'?'var(--blue)':col==='B'?'var(--yel)':'var(--ink-soft)';
    var nm=(t.fld[n]||['',''])[0];
    s+='<g class="z'+(hl?' hl':'')+'" data-f="'+n+'" tabindex="0" role="button" aria-label="'+n+' '+esc(nm)+'"><rect x="'+z[1]+'" y="'+z[2]+'" width="'+z[3]+'" height="'+z[4]+'" rx="6" fill="'+fill+'" stroke="'+st+'" stroke-width="1.5"/>'

  // квадратики пункта 12
  for(var i=0;i<17;i++){var y=106+i*11.6;
    var a=(c.a||[]).indexOf(i+1)>=0,b=(c.b||[]).indexOf(i+1)>=0,mb=(c.mb||[]).indexOf(i+1)>=0;
    s+='<rect x="118" y="'+y+'" width="8" height="8" rx="1.5" fill="'+(a?'var(--blue)':'var(--card)')+'" stroke="var(--blue)"/>'

  var sv=document.getElementById('blankSvg');sv.innerHTML=s;
  sv.querySelectorAll('.z').forEach(function(g){function o(){var n=+g.getAttribute('data-f');if(n===12){document.getElementById('circ').scrollIntoView({behavior:'smooth',block:'start'});return;}
      var f=L[lang].fld[n];openSheet(n+' · '+f[0],'<p>'+f[1]+'</p>');tr('acidente_field',{field:n});}

  document.getElementById('circ').innerHTML=h;}

  document.getElementById('langBtn').textContent=t.code;
  document.getElementById('hubLink').href='https://seedwave.pt/hub/?lang='+lang+'&theme='+theme;
  document.getElementById('carLink').href='https://seedwave.pt/carro/?lang='+lang+'&theme='+theme+'&utm_source=ndm&utm_medium=acidente';

  if(t.md){mset('meta[name="description"]',t.md);mset('meta[property="og:description"]',t.md);}
  chips();setCase(curCase);faq();zeSrc();
}

m.onclick=function(e){var b=e.target.closest('button');if(!b)return;var k=b.getAttribute('data-l');

  lang=k;m.classList.remove('on');paintMenu();apply();};

var big=document.getElementById('big'),cur=0;
function show(i){cur=(i+PH.length)%PH.length;document.getElementById('bigPt').textContent=PH[cur].pt;

document.getElementById('bigPrev').onclick=function(){show(cur-1);};
document.getElementById('bigNext').onclick=function(){show(cur+1);};

function openSheet(h,p){document.getElementById('shT').innerHTML=h;document.getElementById('shP').innerHTML=p;veil.classList.add('on');sh.classList.add('on');}
