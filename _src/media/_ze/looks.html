<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#FAF6F1;--ink:#1F1A17;--soft:#6B625C;--teal:#2F6F8F;--skin:#F2C9A6;--line:#E6DED6;--acc:#A8461F}
html,body{margin:0;background:var(--bg)}body{width:1620px;height:1000px;position:relative;font-family:Inter,system-ui,sans-serif}
svg{position:absolute;left:0;top:0} .lab{position:absolute;top:840px;width:540px;text-align:center;font-weight:700;font-size:34px;color:var(--ink)}
.lab small{display:block;font-weight:400;font-size:22px;color:var(--soft);margin-top:6px}
h1{position:absolute;top:24px;left:0;right:0;text-align:center;font-size:40px;margin:0;color:var(--ink)}
</style></head><body><h1>Зé растёт вместе с проектами</h1>
<div class="lab" style="left:0">1 · Простой Зé<small>бюрократия для людей · гиды nDm</small></div>
<div class="lab" style="left:540px">2 · Зé-предприниматель<small>ИП и малый бизнес · Prazos, мелкие субсидии</small></div>
<div class="lab" style="left:1080px">3 · Зé-консультант<small>субсидии организаций · Painel, Portugal 2030</small></div>
<script>
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function txt(parent,x,y,s,attrs={}){const e=el('text',Object.assign({x,y},attrs),parent);e.textContent=s;return e}
const ROOT=el('svg',{width:1620,height:1000,viewBox:'0 0 1620 1000'},document.body);
function makeZe(ox,level){
 const S=el('g',{transform:`translate(${ox} 40)`},ROOT);
 // ---------- hero Zé (left), same as voos490 ----------
const G=el('g',{},S); const manRoot=el('g',{},G);
const legs=el('g',{},manRoot);
el('rect',{x:160,y:600,width:44,height:150,rx:18,fill:'#3B3A48'},legs); el('rect',{x:226,y:600,width:44,height:150,rx:18,fill:'#3B3A48'},legs);
el('ellipse',{cx:182,cy:752,rx:38,ry:14,fill:'#1F1A17'},legs); el('ellipse',{cx:248,cy:752,rx:38,ry:14,fill:'#1F1A17'},legs);
el('rect',{x:140,y:430,width:150,height:190,rx:40,fill:'var(--teal)'},manRoot);
el('circle',{cx:215,cy:345,r:78,fill:'var(--skin)'},manRoot);
el('circle',{cx:137,cy:350,r:16,fill:'var(--skin)'},manRoot); el('circle',{cx:293,cy:350,r:16,fill:'var(--skin)'},manRoot);
el('circle',{cx:137,cy:350,r:7,fill:'#E0A98A'},manRoot); el('circle',{cx:293,cy:350,r:7,fill:'#E0A98A'},manRoot);
el('path',{d:'M172 292 q20 -22 48 -18',stroke:'#fff','stroke-width':8,'stroke-linecap':'round',fill:'none',opacity:.75},manRoot);
el('path',{d:'M160 395 q55 46 110 0 q-10 26 -55 30 q-45 -4 -55 -30z',fill:'#8C8278',opacity:.35},manRoot);
const browL=el('path',{d:'M180 312 l30 -4',stroke:'#4A2E1E','stroke-width':6,'stroke-linecap':'round',fill:'none'},manRoot);
const browR=el('path',{d:'M222 308 l30 4',stroke:'#4A2E1E','stroke-width':6,'stroke-linecap':'round',fill:'none'},manRoot);
const eyeL=el('ellipse',{cx:193,cy:338,rx:7,ry:8,fill:'#1F1A17'},manRoot); const eyeR=el('ellipse',{cx:239,cy:338,rx:7,ry:8,fill:'#1F1A17'},manRoot);
const cheekL=el('circle',{cx:176,cy:366,r:9,fill:'#F2A08A',opacity:0},manRoot); const cheekR=el('circle',{cx:254,cy:366,r:9,fill:'#F2A08A',opacity:0},manRoot);
const mouth=el('path',{d:'M192 384 h44',stroke:'#8C3B2A','stroke-width':6,'stroke-linecap':'round',fill:'none'},manRoot);
const armL=el('g',{},manRoot); el('path',{d:'M150 470 l-60 110',stroke:'var(--skin)','stroke-width':30,'stroke-linecap':'round'},armL); el('circle',{cx:90,cy:580,r:22,fill:'var(--skin)'},armL);
const armR=el('g',{},manRoot); el('path',{d:'M280 470 l60 110',stroke:'var(--skin)','stroke-width':30,'stroke-linecap':'round'},armR); const handR=el('circle',{cx:340,cy:580,r:22,fill:'var(--skin)'},armR);
// pointing finger (for clicks)
const finger=el('g',{opacity:0},armR);
el('rect',{x:318,y:556,width:48,height:48,rx:14,fill:'var(--skin)'},finger);
el('rect',{x:352,y:520,width:20,height:56,rx:10,fill:'var(--skin)',transform:'rotate(40 362 548)'},finger);
const thumb=el('g',{opacity:0},armR);
el('rect',{x:316,y:556,width:56,height:52,rx:14,fill:'var(--skin)'},thumb);
el('path',{d:'M330 572 h30 M330 586 h30',stroke:'#E0A98A','stroke-width':3,'stroke-linecap':'round'},thumb);
el('rect',{x:308,y:514,width:22,height:52,rx:11,fill:'var(--skin)',transform:'rotate(-14 319 540)'},thumb);
const puff=el('g',{opacity:0},manRoot);
el('ellipse',{cx:300,cy:395,rx:30,ry:20,fill:'#fff',stroke:'var(--line)','stroke-width':3},puff);
txt(puff,282,404,'?',{'font-size':30,fill:'var(--acc)','font-weight':700});



// Гардероб Зé: уровень образа по уровню проекта (принято 08.11.2026, паспорт Зé в Notion).
// Вставлять в scene.html ПОСЛЕ блока «hero Zé» (нужны переменные manRoot, legs, armL, armR) и вызвать zeLook(N).
// 1 — Простой Зé: рубашка #2F6F8F, без растительности (бюрократия для людей, гиды nDm).
// 2 — Зé-предприниматель: тёмно-синий блейзер, аккуратные усы, коричневые туфли (ИП, малый бизнес, Prazos).
// 3 — Зé-консультант / банкир: похудел и подкачался, белая рубашка, приталенный костюм, часы, кейс
//     (субсидии организаций: Painel de Apoios, Portugal 2030, Funcionamento).
function zeLook(level){
  if(level<2) return;
  if(level>=3) return zeBanker();
  const JK='#24384F';
  const jk=el('g',{},manRoot); manRoot.insertBefore(jk,armL);
  el('path',{d:'M140 470 q0 -40 40 -40 h22 l13 60 l13 -60 h22 q40 0 40 40 v150 h-150z',fill:JK},jk);
  el('path',{d:'M202 430 l13 60 l-26 -20z M228 430 l-13 60 l26 -20z',fill:'#1A2A3C'},jk);
  el('circle',{cx:215,cy:560,r:5,fill:'#C9A227'},jk);
  armL.querySelector('path').setAttribute('stroke',JK); armR.querySelector('path').setAttribute('stroke',JK);
  el('path',{d:'M190 372 q25 -14 50 0 q-12 8 -25 3 q-13 5 -25 -3z',fill:'#4A2E1E'},manRoot);   // усы
  legs.querySelectorAll('ellipse').forEach(e=>e.setAttribute('fill','#6B3B1F'));             // коричневые туфли
}
// 3 — Зé-консультант / банкир: похудел и подкачался (V-силуэт, без второго подбородка),
// белая рубашка, приталенный тёмно-синий костюм, галстук цвета акцента, платок в кармане,
// золотые часы, короткая ухоженная борода, чёрные лакированные туфли, тонкий кейс.
function zeBanker(){
  const SUIT='#1B2433', SUIT2='#121925';
  // убрать «второй подбородок» и старое туловище
  manRoot.querySelectorAll('path').forEach(p=>{if(p.getAttribute('opacity')==='0.35'||p.getAttribute('opacity')==='.35')p.remove()});
  manRoot.querySelectorAll('rect').forEach(r=>{if(r.getAttribute('fill')==='var(--teal)')r.remove()});
  // ноги стройнее, костюмные брюки, лакированные туфли
  legs.innerHTML='';
  el('rect',{x:170,y:600,width:36,height:150,rx:14,fill:SUIT},legs); el('rect',{x:224,y:600,width:36,height:150,rx:14,fill:SUIT},legs);
  el('path',{d:'M150 752 q2 -14 22 -14 h26 q10 0 10 14z M222 752 q0 -14 10 -14 h26 q20 0 22 14z',fill:'#0E0E12'},legs);
  el('path',{d:'M160 744 h18 M236 744 h18',stroke:'#fff','stroke-width':3,'stroke-linecap':'round',opacity:.5},legs);
  const body=el('g',{},manRoot); manRoot.insertBefore(body,armL);
  // белая рубашка, V-силуэт: широкие плечи, узкая талия
  el('path',{d:'M146 470 q0 -40 40 -42 h58 q40 2 40 42 l-20 150 h-98z',fill:'#FFFFFF',stroke:'#E3E6EA','stroke-width':2},body);
  // пиджак: две полы, открытая грудь
  el('path',{d:'M146 470 q0 -40 40 -42 h10 l12 66 l-10 126 h-44z',fill:SUIT},body);
  el('path',{d:'M284 470 q0 -40 -40 -42 h-10 l-12 66 l10 126 h44z',fill:SUIT},body);
  el('path',{d:'M196 428 l12 66 l-26 -32z M234 428 l-12 66 l26 -32z',fill:SUIT2},body);          // лацканы
  el('path',{d:'M215 540 v70',stroke:'#E3E6EA','stroke-width':2},body); el('circle',{cx:215,cy:556,r:2.5,fill:'#C9CDD3'},body); el('circle',{cx:215,cy:586,r:2.5,fill:'#C9CDD3'},body); // пуговицы рубашки
  el('path',{d:'M207 430 h16 l5 16 l-13 74 l-13 -74z',fill:'var(--acc)'},body);                  // галстук
  el('path',{d:'M203 430 l12 12 l12 -12',fill:'none',stroke:'#E3E6EA','stroke-width':3},body);  // воротник
  el('path',{d:'M244 512 l18 -4 l2 8 l-18 4z',fill:'#FFFFFF'},body);                             // платок в кармане
  // лицо стройнее: голова чуть уже, уши ближе
  manRoot.querySelectorAll('circle').forEach(c=>{const cx=+c.getAttribute('cx'),cy=+c.getAttribute('cy'),r=+c.getAttribute('r');
    if(cx===215&&cy===345&&r===78)c.setAttribute('transform','translate(215 345) scale(0.9 1) translate(-215 -345)');
    if(cy===350&&(cx===137||cx===293))c.setAttribute('cx',cx===137?145:285);});
  // руки в рукавах костюма, тоньше; золотые часы на левом запястье
  [armL,armR].forEach(a=>{const p=a.querySelector('path');p.setAttribute('stroke',SUIT);p.setAttribute('stroke-width',26);});
  el('rect',{x:80,y:548,width:22,height:12,rx:4,fill:'#D4AF37',transform:'rotate(-60 91 554)'},armL);
  // короткая ухоженная борода + усы
  el('path',{d:'M166 376 q6 44 49 48 q43 -4 49 -48 q-8 22 -49 24 q-41 -2 -49 -24z',fill:'#3E2617'},manRoot);
  el('path',{d:'M188 372 q27 -12 54 0 q-14 7 -27 3 q-13 4 -27 -3z',fill:'#3E2617'},manRoot);
  // тонкий кожаный кейс
  const bc=el('g',{transform:'translate(58 584)'},armL);
  el('rect',{x:-14,y:-6,width:30,height:12,rx:5,fill:'none',stroke:'#2A1C14','stroke-width':4},bc);
  el('rect',{x:-40,y:4,width:84,height:58,rx:7,fill:'#3A2416'},bc);
  el('rect',{x:-4,y:22,width:12,height:7,rx:2,fill:'#D4AF37'},bc);
}

 mouth.setAttribute('d','M186 378 q29 30 58 0'); cheekL.setAttribute('opacity',1); cheekR.setAttribute('opacity',1);
 zeLook(level);
}
makeZe(55,1); makeZe(595,2); makeZe(1135,3);
</script></body></html>
