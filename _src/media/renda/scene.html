  // ---- plus + coins 12–15 ----
  {const p=bk(seg(t,10.6,11.1));op(PLUS,(t<12?seg(t,10.6,10.8)*(1-seg(t,11.6,11.9)):0)+(t>=12?seg(t,12.3,12.6)*(1-seg(t,14.7,15)):0));
   plusT.textContent='+'+fmt(2340,LG)+' '+T.yr;
   tr(PLUS,t<12?`translate(545 700) scale(${p})`:`translate(560 330) scale(${.9+.05*Math.sin(t*5)})`);}
  op(PIG,seg(t,12.4,12.8)*(1-seg(t,14.7,15))); tr(PIG,`translate(560 ${630}) scale(${.9+.06*Math.sin(t*8)})`);
  if(t>12.4&&t<15){op(HOUSE,0);op(SIGN,0);}
  coins.forEach((g,i)=>{const t0=12.5+i*.14;const u=seg(t,t0,t0+.7);op(g,u>0&&u<1?1:0);tr(g,`translate(${430+((i*73)%260)} ${180+u*430}) rotate(${u*360})`)});
  // ---- alert 15–18 ----
  {const a=bk(seg(t,15.7,16.1));op(ALERT,a*(1-seg(t,17.4,17.7)));tr(ALERT,`translate(560 430) scale(${.8*a+.04*Math.sin(t*12)})`);}
}
render(0);
